# Stage 1 --- single limb to a single hold (docs/05).
#
# Hyperparameters started from ml-agents' ppo/Walker.yaml: same ragdoll, same JointDriveController,
# same action shape, so its settings were the closest known-good starting point. What is still
# actually inherited from Walker at this point is noted where it matters; the rest has been
# retuned against measured runs (see worklog/2026-09-26-stage1-02-analysis.md).
behaviors:
  Climber:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      # All three pinned constant, not just learning_rate. stage1-04 ran under the ml-agents
      # default (linear decay to 0 by max_steps) for its first 9M steps: RightHand was still stuck
      # at 5% success when beta had already decayed to a third of its start value, and it only broke
      # out once a --resume picked these up as constant. A schedule that starves exploration before
      # every limb has converged punishes whichever one is slowest to learn.
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      # Walker uses 256 wide. The observation here is 256 wide and carries four target slots on top
      # of the body, so the first layer is not the bottleneck to start with; raise this before
      # reaching for more layers if returns plateau early.
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # Lower than Walker's 0.995. One limb move is over in 1-2 s (10-20 decisions), not a
        # continuous gait, so crediting 200 decisions back is wasted horizon.
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 20000000
    # Agent.MaxStep is 300 *physics* steps (60 decisions, docs/05) -- this is in decision-steps and
    # only has to clear that, so it is not a knob that needs to track MaxStep 1:1.
    time_horizon: 1000
    summary_freq: 20000
