# Stage 1 --- single limb to a single hold (docs/05).
#
# Hyperparameters start from ml-agents' ppo/Walker.yaml: same ragdoll, same JointDriveController,
# same action shape, so its settings are the closest known-good starting point. Differences are
# noted below and are all consequences of the task being shorter than walking.
behaviors:
  Climber:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      # Walker uses 256 wide. The observation here is 256 wide and carries four target slots on top
      # of the body, so the first layer is not the bottleneck to start with; raise this before
      # reaching for more layers if returns plateau early.
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        # Lower than Walker's 0.995. One limb move is over in 1-2 s (10-20 decisions), not a
        # continuous gait, so crediting 200 decisions back is wasted horizon.
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    # Far short of Walker's 30M: the episode terminates on success rather than running forever, and
    # the task is one move. Raise it if the success rate is still climbing when this runs out.
    max_steps: 5000000
    # The agent's MaxStep is 1000 decisions, so no episode outlives this horizon.
    time_horizon: 1000
    summary_freq: 20000
